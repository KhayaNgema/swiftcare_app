name: swiftcare_volunteer_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  camera: ^0.11.1
  http: ^1.5.0
  url_launcher: ^6.3.1
  didit_sdk: ^4.9.0
  flutter_secure_storage: ^9.2.4
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icon/swiftcare_app_icon.png
    - assets/icon/swiftcare_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/swiftcare_logo.png
  min_sdk_android: 21